# 依存と GitHub Actions の更新を可視化する（自動追従の暗黙の脆さを、明示的な更新 PR に変える）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
