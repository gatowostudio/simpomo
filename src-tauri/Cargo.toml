[package]
name = "simpomo"
version = "0.2.0"
description = "シンプルで軽量なポモドーロタイマー"
authors = ["gatowostudio"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "simpomo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: システムトレイ常駐（✕=非表示・トレイから再表示/終了）に使う。
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# 設定の永続化（settings.json の入出力）に使う。
serde_json = "1"
# ウィンドウのサイズ/最大化状態を永続化・復元する。
tauri-plugin-window-state = "2"
# 「更新を確認」でリリースページを既定ブラウザで開くために使う。
tauri-plugin-opener = "2"
# 二重起動を防ぎ、2 回目起動時は既存ウィンドウを前面化する（#18）。
tauri-plugin-single-instance = "2"
# 非表示中のフェーズ境界を OS トースト通知で知らせる（#20）。
tauri-plugin-notification = "2"
# OS スタートアップ登録（ログイン時に自動起動）の ON/OFF（#21）。
tauri-plugin-autostart = "2"
